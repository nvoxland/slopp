# Human-owned CI (lives on main; slopp never touches it). GitHub only runs
# push-triggered workflows from the pushed ref's tree, so slopp-branch pushes
# can't trigger directly — this checks out the slopp branch on a schedule and
# on demand instead.
name: test
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
jobs:
  # There is no "suite from files" lane any more, and its absence is a
  # finding. `clojure -M:test` from the checkout ran cognitect over the
  # projected tree, and that was never the suite: two namespaces assume
  # slopp's own runner (rt-test's tracing sink, cli-test's fixture namespace)
  # and failed on every run — and rt-test armed a parent-death watchdog in
  # the runner's JVM, which read the runner's /dev/null stdin as a dead
  # parent and exited 0 mid-run, before cognitect's summary. The lane stayed
  # green for months while never finishing. The suite is what `slopp.sync
  # test` runs — the sharded external tier over a store built from this
  # checkout — and that is test-via-slopp below, which is also the only run
  # that puts every namespace through every write gate on the way in.
  # The SHIPPED prose — plugins/slopp/skills/** and docs/** — is the product,
  # and until now nothing checked it. The guard that exists for this class,
  # mcp-test's slopp-prose-never-names-a-tool-that-does-not-exist, scans STORE
  # FORMS; the skills and docs are FILES, and no test can reach them: the
  # external tier runs in the materialized build dir, which carries src, test
  # and the config projections and NOT docs/ or plugins/. Same shape as the
  # kernel below — two copies of one truth, only both visible from a checkout
  # that can see both refs.
  #
  # Four bugs went out through that gap in a single day (2026-08-02). The
  # skill told agents to read session_brief's :ui-hub, a key that returns nil,
  # and to set dev.server, a capability config_file would refuse;
  # slopp-review's url template double-appended /p/<slug>, a guaranteed 404 in
  # the bullet whose point is that the wrong address costs a 404; the tools
  # reference documented ui.hub-port and ui.port. Every one was a rename that
  # rewrote the store and walked past the files, and all four were found by a
  # human grep that happened for an unrelated reason.
  #
  # This is the inverse of kernel-parity's reach: main holds the prose,
  # slopp/main holds the store's rendered source. Comparing the two is what
  # catches a doc that documents something the code no longer declares.
  shipped-prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # slopp/main must be reachable — it holds the
                           # rendered capability registry
      # No JVM: the prose is files and the registry is rendered on the branch,
      # so this is git and grep. It also means a broken store cannot make this
      # lane unrunnable, which matters for the one check aimed at what ships.
      - name: Shipped prose documents no undeclared capability
        run: bin/check-shipped-prose.sh

  # build.clj exists TWICE for the same reason the kernel does, with the
  # authorship running the OTHER way. A human owns the file on main and
  # `clojure -T:build uber` runs THAT copy; the store carries a mirror on its
  # files manifest, which is what `build!` materializes and therefore what the
  # EXTERNAL TEST TIER reads.
  #
  # So a build.clj edit that is not mirrored has a signature that reads as
  # success: the jar builds from the new code while every test about build.clj
  # asserts against the old. It happened through the whole capability wave —
  # the file-set became a loop over the catalog's families on main, the store
  # kept the hand-written web glob, and
  # modules-test/the-slim-framework-jar-carries-the-syntax-it-lets-the-framework-use
  # sat green the entire time because its guard-the-guard was reading the stale
  # copy. A test cannot notice: in every context a test runs, the file IS the
  # store's mirror, so the comparison is the tautology kernel-parity already
  # learned about.
  #
  # Byte identity is the right bar here, unlike the kernel's surface parity:
  # the mirror is made by `file_put :source`, a literal copy of the bytes.
  tracked-file-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # slopp/main must be reachable — it holds the mirror
      # No JVM: two blobs and a comparison. The lane that exists to notice a
      # broken build script must not need the build script to run.
      - name: Files humans own match the store's mirror of them
        run: |
          SP=""
          for r in slopp/main origin/slopp/main; do
            if git rev-parse --verify --quiet "$r^{commit}" >/dev/null; then SP="$r"; break; fi
          done
          [ -n "$SP" ] \
            || { echo "FAIL: no slopp/main or origin/slopp/main in this checkout -- this job needs BOTH refs; does it fetch depth 0?" >&2; exit 2; }
          echo "comparing against $SP @ $(git log -1 --format='%h %cs' "$SP")"
          # A list, so covering the next such file is a one-word edit. Today
          # build.clj is the only one: deps.edn is GENERATED per store by
          # build/deps-edn rather than mirrored, and the kernel's two copies
          # have their own lane because theirs is a rendering, not a copy.
          for p in build.clj; do
            git show "$SP:$p" > "/tmp/mirror-$(basename "$p")" 2>/dev/null \
              || { echo "::error::$p is not on $SP -- the store should carry it on its files manifest"; exit 1; }
            # Name the REMEDY. "the copies differ" leaves the reader to discover
            # that the store holds a mirror at all, which is the fact they were
            # already missing when they got here.
            diff -u "/tmp/mirror-$(basename "$p")" "$p" \
              || { echo "::error::the store's mirror of $p is stale -- from a main checkout run: slopp --call file_put '{\"path\":\"$p\",\"source\":\"'\"\$PWD\"'/$p\"}'"; exit 1; }
          done

  # The kernel (slopp.kernel.rt, slopp.kernel.boot) exists TWICE and both copies are live:
  # a hand-maintained file on main serves a main-checkout dev run — which is
  # how the benchmarks execute — while the store's projection is what the jar
  # ships and what build! materializes for the external tier.
  #
  # No TEST can compare them. In every context a test runs, the "file" IS the
  # store's rendering, so the comparison is a tautology that passes vacuously;
  # that one was written and caught here already. The two copies are only both
  # reachable from a checkout that can see both refs, which is this job.
  #
  # They have drifted three times. Twice found by hand days later; the third
  # found by this check on its first run — the store copy had never gained
  # add-manifest-libs!, so "java -jar slopp.jar <dir> works for ANY app" was
  # true only of the copy no user runs. A store-wide rename cannot see a file,
  # so every future rename has the same blind spot.
  kernel-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slopp/main
          fetch-depth: 0   # main must be reachable — it is the other copy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.deps.clj
            ~/.clojure
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-
      # The checked-out tree IS slopp/main, so src/slopp/*.clj here is the
      # store's projection; main's copy comes out of git. Surface + behaviour
      # parity, not identity: form order and the store-only markers differ
      # legitimately, and the ns form is not compared at all.
      #
      # A trailing argument NAMES a divergence that is deliberate. There is
      # none right now — main's copies were reconciled against the projection
      # on 2026-08-02 and the two agree exactly. Keep it that way: the copies
      # have drifted four times, the file has never once held anything the
      # store lacked, and the last drift left main carrying a live-reload bug
      # the store had already fixed. If you must add a name here, the
      # declaration polices itself — when it stops describing a real
      # difference the check fails asking you to drop it, so this cannot
      # quietly become a mute button.
      # `main` is not a LOCAL branch here: actions/checkout creates
      # remote-tracking refs only, so a bare `main` resolves in a developer
      # clone and fails on the runner with "invalid object name". Same
      # ref-resolution gap that made check-shipped-prose.sh unrunnable, and it
      # fails the same silent way — the job that exists to compare two copies
      # cannot reach one of them. Accept either spelling, and say which is
      # missing rather than letting `git show` explain it.
      - name: The kernel's two copies still agree
        run: |
          MAIN=""
          for r in main origin/main; do
            if git rev-parse --verify --quiet "$r^{commit}" >/dev/null; then MAIN="$r"; break; fi
          done
          [ -n "$MAIN" ] \
            || { echo "FAIL: no main or origin/main in this checkout -- this job needs BOTH refs; does it fetch depth 0?" >&2; exit 2; }
          echo "comparing against $MAIN @ $(git log -1 --format='%h %cs' "$MAIN")"
          git show "$MAIN:src/slopp/kernel/rt.clj"   > /tmp/rt-main.clj
          git show "$MAIN:src/slopp/kernel/boot.clj" > /tmp/boot-main.clj
          # Name the REMEDY, not just the symptom. main's copies are generated by
          # bin/extract-projection.sh; drift here means that was not run before
          # committing, and a reader told only "the copies differ" has to go find
          # that out. A diagnosis the reader cannot act on is half a message.
          stale() { echo "::error::main's kernel copy is stale -- from a main checkout run bin/extract-projection.sh and commit the result"; exit 1; }
          clojure -M -m slopp.sync kernel /tmp/rt-main.clj   src/slopp/kernel/rt.clj   || stale
          clojure -M -m slopp.sync kernel /tmp/boot-main.clj src/slopp/kernel/boot.clj || stale
  test-via-slopp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slopp/main
          fetch-depth: 0   # the clone GRAFTS onto the branch's history and walks
                           # its commits — a one-commit checkout dies inside JGit
                           # as "Walk failure", reproduced locally with --depth 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.deps.clj
            ~/.clojure
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - name: Import the slopp branch into a store (every write gated)
        env:
          SLOPP_CLOJURE: clojure
        run: |
          git branch slopp HEAD 2>/dev/null || true
          clojure -M -m slopp.sync clone "$PWD" /tmp/store
      - name: Run the store's suite (isolated tier, built from the store)
        env:
          SLOPP_CLOJURE: clojure
        run: clojure -M -m slopp.sync test /tmp/store
