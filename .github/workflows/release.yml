name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'release tag (e.g. v0.1.2)'
        required: true
permissions:
  contents: write
jobs:
  uberjar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slopp/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.deps.clj
            ~/.clojure
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-
      # GATED on the in-image suite, the same 21s the test workflow runs,
      # before anything is jarred: a release lane that only smokes the daemon
      # would ship a red store with a working listener. The ^:external tier
      # is full_check's, run by hand before the commit point — see test.yml.
      - name: The in-image suite is green
        env:
          SLOPP_CLOJURE: clojure
        run: |
          clojure -Sdeps '{:aliases {:tm {:extra-paths ["test"] :extra-deps {io.github.cognitect-labs/test-runner {:git/tag "v0.5.1" :git/sha "dfb30dd"}} :main-opts ["-m" "slopp.image.testmain" "-d" "test" "-e" ":external"]}}}' -M:tm
      - name: Build the uberjar from the slopp branch
        run: |
          clojure -Sdeps '{:deps {io.github.clojure/tools.build {:mvn/version "0.10.5"}} :paths ["."]}' \
            -M -e '((requiring-resolve (quote build/uber)) {:src "src"})'
      # The jar IS the daemon now (the stdio server is retired), so the smoke
      # is the daemon's: boot from a neutral dir, bind a port, answer
      # /api/status, and stop. A hang here is a release that never ships,
      # which is the right failure for a jar that cannot come up.
      - name: Smoke it — the daemon binds, answers /api/status, and stops
        run: |
          # -Duser.home, not $HOME: the JVM reads its home from the OS, so
          # the daemon file lands where the JVM thinks home is
          SMOKE=/tmp/smoke-home; mkdir -p "$SMOKE/.slopp"
          java -Duser.home="$SMOKE" -jar "$GITHUB_WORKSPACE/target/slopp.jar" "$SMOKE/.slopp" --main slopp.daemon/-main 7399 > /tmp/smoke.log 2>&1 &
          pid=$!
          ok=""
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:7399/api/status > /tmp/status.json; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if [ -z "$ok" ]; then
            cat /tmp/smoke.log
            echo "::error::the daemon did not answer /api/status within 120s"
            exit 1
          fi
          cat /tmp/status.json; echo
          test -s "$SMOKE/.slopp/daemon-7399.json" || { echo "::error::the daemon recorded no daemon file"; ls -la "$SMOKE/.slopp"; exit 1; }
      - name: Tag + release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/${{ inputs.version }}" -f sha="$(git rev-parse HEAD)" || true
          gh release create "${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" --title "slopp ${{ inputs.version }}" --generate-notes || true
          gh release upload "${{ inputs.version }}" target/slopp.jar --repo "$GITHUB_REPOSITORY" --clobber
