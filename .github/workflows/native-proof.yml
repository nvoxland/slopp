name: native-proof
on:
  workflow_dispatch:
jobs:
  native-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slopp/main
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - name: Build a sample app through slopp and compile it native
        env:
          SLOPP_CLOJURE: clojure
        run: |
          python3 - /tmp/appstore <<'PY'
          import base64, json, os, subprocess, sys, time, urllib.request
          # The daemon is the only server: start one from the checkout (src/ is
          # on the classpath), then drive it the way `slopp <op>` does — one
          # POST per call to the write door, the project named by X-Slopp-Dir,
          # every write on a thread, the token from the daemon's own file.
          STORE = sys.argv[1]; os.makedirs(STORE, exist_ok=True)
          home = os.path.expanduser("~"); os.makedirs(home + "/.slopp", exist_ok=True)
          log = open("/tmp/daemon.log", "w")
          daemon = subprocess.Popen(["clojure", "-M", "-m", "slopp.daemon", "7357"], stdout=log, stderr=subprocess.STDOUT)
          for _ in range(180):
              try:
                  urllib.request.urlopen("http://127.0.0.1:7357/api/status", timeout=2); break
              except Exception:
                  time.sleep(1)
          else:
              print(open("/tmp/daemon.log").read()); raise SystemExit("the daemon did not come up")
          token = json.load(open(home + "/.slopp/daemon.json"))["token"]
          def call(tool, **args):
              args.setdefault("thread", "ci"); args.setdefault("agent", "ci")
              body = json.dumps({"tool": tool, "arguments": args, "token": token}).encode()
              req = urllib.request.Request("http://127.0.0.1:7357/api/projects/_/call", data=body,
                                           headers={"Content-Type": "application/json", "X-Slopp-Dir": STORE})
              with urllib.request.urlopen(req, timeout=1200) as r:
                  out = json.load(r)
              txt = out.get("text", "") if isinstance(out, dict) else json.dumps(out)
              print(tool, txt[:160].replace("\n", " "))
              assert not (isinstance(out, dict) and out.get("isError")), txt
              return out
          call("turn_begin", intent="native-image proof")
          call("ns_create", ns="app.core", prompt="the proof app",
               source="(ns app.core)\n(defn greet \"G.\" [nm] (str \"hello, \" nm \"!\"))\n(defn -main \"M.\" [& args] (println (greet (or (first args) \"native\"))))")
          call("build", dir="/tmp/app", main="app.core/-main", name="app")
          call("turn_end")
          daemon.terminate()
          PY
          cd /tmp/app && bash build-native.sh
      - name: Run the binary
        run: |
          out=$(/tmp/app/app world)
          echo "$out"
          test "$out" = "hello, world!"
  native-web-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slopp/main
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      # No slim-install step, and its absence is the proof. slopp's http layer is
      # never published to a remote (D-framework-injection part 2), so this
      # runner has no way to resolve it — slopp VENDORS the framework into the
      # built tree.
      # A green run here means a slopp-built web app is self-contained on a
      # machine that has never seen the artifact.
      - name: Build a web app through slopp, with no framework artifact anywhere
        env:
          SLOPP_CLOJURE: clojure
        run: |
          python3 - /tmp/webstore <<'PY'
          import base64, json, os, subprocess, sys, time, urllib.request
          # The daemon is the only server: start one from the checkout (src/ is
          # on the classpath), then drive it the way `slopp <op>` does — one
          # POST per call to the write door, the project named by X-Slopp-Dir,
          # every write on a thread, the token from the daemon's own file.
          STORE = sys.argv[1]; os.makedirs(STORE, exist_ok=True)
          home = os.path.expanduser("~"); os.makedirs(home + "/.slopp", exist_ok=True)
          log = open("/tmp/daemon.log", "w")
          daemon = subprocess.Popen(["clojure", "-M", "-m", "slopp.daemon", "7357"], stdout=log, stderr=subprocess.STDOUT)
          for _ in range(180):
              try:
                  urllib.request.urlopen("http://127.0.0.1:7357/api/status", timeout=2); break
              except Exception:
                  time.sleep(1)
          else:
              print(open("/tmp/daemon.log").read()); raise SystemExit("the daemon did not come up")
          token = json.load(open(home + "/.slopp/daemon.json"))["token"]
          def call(tool, **args):
              args.setdefault("thread", "ci"); args.setdefault("agent", "ci")
              body = json.dumps({"tool": tool, "arguments": args, "token": token}).encode()
              req = urllib.request.Request("http://127.0.0.1:7357/api/projects/_/call", data=body,
                                           headers={"Content-Type": "application/json", "X-Slopp-Dir": STORE})
              with urllib.request.urlopen(req, timeout=1200) as r:
                  out = json.load(r)
              txt = out.get("text", "") if isinstance(out, dict) else json.dumps(out)
              print(tool, txt[:160].replace("\n", " "))
              assert not (isinstance(out, dict) and out.get("isError")), txt
              return out
          png = b"\x89PNG\r\n\x1a\n<3slopp"
          src = '''(ns app.web
            (:require [slopp.http :as http]
                      [slopp.http.static :as static]))

          (defn ^{:http/method :get :rest/path "/api/hello" :http/auth :public
                  :rest/response [:map [:msg :string]]} hello
            "The proof endpoint."
            [_req]
            {:status 200 :body {:msg "hi from slopp-http"}})

          (defn -main
            "Serve the declared endpoints + the /assets mount, and block."
            [& _]
            (http/serve! {:http/namespaces '[app.web]
                          :http/routes (static/mount-routes {"/assets" "public"}
                                                            (static/file-or-resource-reader "."))
                          :http/port 8087})
            @(promise))
          '''
          call("turn_begin", intent="native web proof")
          call("config_file", path="capabilities", key="http.enabled", value="true", prompt="ci")
          call("config_file", path="capabilities", key="rest.enabled", value="true", prompt="ci")
          call("config_file", path="capabilities", key="http.static./assets", value="public", prompt="ci")
          call("file_put", path="public/logo.png", encoding="base64", content_type="image/png",
               content=base64.b64encode(png).decode(), prompt="ci asset")
          call("ns_create", ns="app.web", source=src, prompt="the proof web app")
          call("build", dir="/tmp/webapp", main="app.web/-main", name="webapp")
          call("turn_end")
          daemon.terminate()
          PY
          cd /tmp/webapp && bash build-native.sh
      - name: Run the binary and curl the endpoint and the asset
        run: |
          cd /tmp/webapp
          ./webapp &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8087/api/hello && break || sleep 1; done
          body=$(curl -s http://127.0.0.1:8087/api/hello)
          echo "$body"; echo "$body" | grep -q "hi from slopp-http"
          curl -s http://127.0.0.1:8087/assets/logo.png -o got.png
          printf '\x89PNG\r\n\x1a\n<3slopp' > want.png
          cmp got.png want.png && echo "asset bytes exact"
          type=$(curl -s -D - -o /dev/null http://127.0.0.1:8087/assets/logo.png | grep -i '^content-type' | tr -d '\r')
          echo "$type"; echo "$type" | grep -qi "image/png"
          kill %1
